# DianaV2 Database Backup Cron Configuration
# Kubernetes CronJob for automated daily backups
#
# This defines a Kubernetes CronJob that runs database backups daily at 2:00 AM UTC.
# The backup script supports both local storage and S3 upload.
#
# Validation Contract: VAL-DP-002
#
# Prerequisites:
#   - Kubernetes cluster with CronJob support
#   - PostgreSQL database running
#   - S3 bucket configured (if using S3 storage)
#   - Secrets created: diana-db-secret, diana-backup-secret
#
# Usage:
#   kubectl apply -f deployment/backup-cron.yml
#
# Manual trigger:
#   kubectl create job --from=cronjob/diana-backup diana-backup-manual-$(date +%s)

apiVersion: batch/v1
kind: CronJob
metadata:
  name: diana-backup
  namespace: diana
  labels:
    app: diana
    component: backup
    tier: operations
spec:
  # Run daily at 2:00 AM UTC (off-peak hours for minimal disruption)
  schedule: "0 2 * * *"
  
  # Concurrency policy: Allow concurrent runs if previous still running
  # This ensures backups don't skip if previous is slightly delayed
  concurrencyPolicy: Allow
  
  # Keep successful job history for 3 runs (for debugging)
  successfulJobsHistoryLimit: 3
  
  # Keep failed job history for 5 runs (for troubleshooting)
  failedJobsHistoryLimit: 5
  
  # Start deadline: Allow 1 hour window for job to start
  startingDeadlineSeconds: 3600
  
  jobTemplate:
    spec:
      # Job timeout: Allow up to 30 minutes for backup
      activeDeadlineSeconds: 1800
      
      # Backoff limit: Retry 3 times on failure
      backoffLimit: 3
      
      template:
        metadata:
          labels:
            app: diana
            component: backup
        spec:
          restartPolicy: OnFailure
          
          # Use service account with appropriate permissions
          serviceAccountName: diana-backup-sa
          
          containers:
            - name: backup
              image: postgres:16-alpine
              
              command:
                - /bin/sh
                - -c
                - |
                  # Backup script uses DB_* env vars from Kubernetes secrets
                  export BACKUP_STORAGE="${BACKUP_STORAGE:-local}"
                  export BACKUP_S3_BUCKET="${BACKUP_S3_BUCKET}"
                  export BACKUP_RETENTION_DAYS="${BACKUP_RETENTION_DAYS:-30}"
                  export BACKUP_DIR="/backups"
                  
                  # Run backup script
                  /scripts/backup.sh
                  
                  # Upload to S3 if configured
                  if [ "${BACKUP_STORAGE}" = "s3" ]; then
                    latest_backup=$(ls -t /backups/diana_backup_*.sql.gz | head -1)
                    aws s3 cp "$latest_backup" "s3://${BACKUP_S3_BUCKET}/$(basename $latest_backup)"
                  fi
                  
                  # Apply retention policy
                  find /backups -name "diana_backup_*.sql.gz" -mtime +${BACKUP_RETENTION_DAYS} -delete
              
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: diana-db-secret
                      key: host
                
                - name: DB_PORT
                  value: "5432"
                
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: diana-db-secret
                      key: user
                
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: diana-db-secret
                      key: password
                
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: diana-db-secret
                      key: database
                
                - name: BACKUP_STORAGE
                  valueFrom:
                    configMapKeyRef:
                      name: diana-backup-config
                      key: storage-type
                      optional: true
                
                - name: BACKUP_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: diana-backup-secret
                      key: s3-bucket
                      optional: true
                
                - name: BACKUP_RETENTION_DAYS
                  valueFrom:
                    configMapKeyRef:
                      name: diana-backup-config
                      key: retention-days
                      optional: true
              
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
                
                - name: aws-config
                  mountPath: /root/.aws
                  readOnly: true
              
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: diana-backup-pvc
            
            - name: backup-scripts
              configMap:
                name: diana-backup-scripts
                defaultMode: 0755
            
            - name: aws-config
              secret:
                secretName: diana-aws-credentials
                optional: true

---
# Monthly Restoration Test CronJob
# Runs on the 1st of every month at 3:00 AM UTC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: diana-restoration-test
  namespace: diana
  labels:
    app: diana
    component: backup
    tier: operations
    type: restoration-test
spec:
  # Run monthly on the 1st at 3:00 AM UTC
  schedule: "0 3 1 * *"
  
  concurrencyPolicy: Forbid
  
  successfulJobsHistoryLimit: 12  # Keep 12 months of test results
  
  failedJobsHistoryLimit: 6
  
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600  # 1 hour timeout
      
      backoffLimit: 1  # Only retry once for tests
      
      template:
        spec:
          restartPolicy: OnFailure
          
          serviceAccountName: diana-backup-sa
          
          containers:
            - name: restoration-test
              image: postgres:16-alpine
              
              command:
                - /bin/sh
                - -c
                - |
                  # Restoration test uses DB_* env vars from Kubernetes secrets
                  export BACKUP_DIR="/backups"
                  
                  # Run restoration test
                  /scripts/backup.sh --test
                  
                  # Log result
                  test_result=$?
                  if [ $test_result -eq 0 ]; then
                    echo "Restoration test PASSED at $(date)"
                  else
                    echo "Restoration test FAILED at $(date)"
                    # Send alert (could integrate with alerting system)
                  fi
              
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: diana-db-secret
                      key: host
                
                - name: DB_PORT
                  value: "5432"
                
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: diana-db-secret
                      key: user
                
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: diana-db-secret
                      key: password
                
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: diana-db-secret
                      key: database
              
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
              
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
          
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: diana-backup-pvc
            
            - name: backup-scripts
              configMap:
                name: diana-backup-scripts
                defaultMode: 0755

---
# Persistent Volume Claim for backup storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: diana-backup-pvc
  namespace: diana
  labels:
    app: diana
    component: backup
spec:
  accessModes:
    - ReadWriteOnce
  
  resources:
    requests:
      storage: 50Gi  # Adjust based on backup size and retention
  
  # Use default storage class or specify one
  storageClassName: standard

---
# ConfigMap for backup configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: diana-backup-config
  namespace: diana
data:
  storage-type: "s3"  # Options: local, s3
  retention-days: "30"
  
---
# Service Account for backup operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diana-backup-sa
  namespace: diana
automountServiceAccountToken: false

---
# Role for backup operations (limited permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: diana-backup-role
  namespace: diana
rules:
  # Read secrets for database credentials
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["diana-db-secret", "diana-backup-secret", "diana-aws-credentials"]
    verbs: ["get"]
  
  # Read configmaps for backup configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["diana-backup-config", "diana-backup-scripts"]
    verbs: ["get"]

---
# RoleBinding for backup service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: diana-backup-rolebinding
  namespace: diana
subjects:
  - kind: ServiceAccount
    name: diana-backup-sa
    namespace: diana
roleRef:
  kind: Role
  name: diana-backup-role
  apiGroup: rbac.authorization.k8s.io

---
# ConfigMap for backup script reference
# The actual backup script is located at scripts/backup.sh in the repository
apiVersion: v1
kind: ConfigMap
metadata:
  name: diana-backup-scripts
  namespace: diana
data:
  script-path: "/scripts/backup.sh"
