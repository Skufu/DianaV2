name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Backend Go tests and lint
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m

      - name: Validate sqlc schema (detect API drift)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          sqlc generate
        working-directory: backend

      - name: Check for uncommitted sqlc changes
        run: |
          if ! git diff --quiet internal/store/sqlc/; then
            echo "❌ ERROR: sqlc-generated code is out of sync with schema!"
            echo "Run 'cd backend && sqlc generate' to regenerate."
            git diff internal/store/sqlc/
            exit 1
          fi
        working-directory: backend

      - name: Run API drift detection script
        run: bash scripts/dev/check-api-drift.sh
        working-directory: .


      - name: Test with coverage and timing
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic -json ./... > test-results.json 2>&1 || true
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DB_SOURCE: "postgres://postgres:postgres@localhost:5432/diana_test?sslmode=disable"
          ENVIRONMENT: "test"

      - name: Install bc for coverage comparison
        run: sudo apt-get install -y bc

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out > coverage-summary.txt
          cat coverage-summary.txt
          # Check if coverage is below 70%
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "${COVERAGE} < 70" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          else
            echo "✓ Coverage ${COVERAGE}% meets 70% threshold"
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.out
          flags: backend
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/test-results.json
            backend/coverage-summary.txt
            backend/coverage.out
          retention-days: 30

  # Frontend build, lint, and test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build --workspace=frontend
        env:
          VITE_API_BASE: http://localhost:8080
          VITE_ML_BASE: http://localhost:5000

      - name: Lint
        run: npm run lint --workspace=frontend

      - name: Test with coverage
        run: npm run test:coverage --workspace=frontend
        env:
          VITE_API_BASE: http://localhost:8080
          VITE_ML_BASE: http://localhost:5000

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
          retention-days: 30

  # Python ML server tests
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ian_ML
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Ian_ML/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov pytest-randomly pytest-xdist

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check import
        run: python -c "from service.predict import DianaPredictor; print('Import OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run ML tests with coverage and timing
        run: pytest tests/ -v --tb=short --durations=10 --cov=service --cov=common --cov=training --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=70
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload ML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-coverage
          path: |
            Ian_ML/htmlcov/
            Ian_ML/coverage.xml
          retention-days: 30

      - name: Upload test durations report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-test-durations
          path: Ian_ML/.pytest_cache/
          retention-days: 14

  # Docker build test
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: false
          tags: diana-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Ian_ML/Dockerfile
          push: false
          tags: diana-ml:test

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: diana-frontend:test
          build-args: |
            VITE_API_BASE=http://localhost:8080
            VITE_ML_BASE=http://localhost:5000
