name: Security

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  # Required for CodeQL
  actions: read
  contents: read
  security-events: write

jobs:
  # CodeQL Analysis for Go, Python, and JavaScript
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'python', 'javascript' ]
        # Learn more about CodeQL language support:
        # https://aka.ms/codeql-docs/language-support

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Add queries for security-extended and security-and-quality
          queries: security-extended,security-and-quality

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Semgrep Static Analysis
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep --config=auto \
                  --error \
                  --json \
                  --output=semgrep-results.json \
                  --metrics=off \
                  --exclude=tests \
                  --exclude=test \
                  --exclude=node_modules \
                  --exclude=venv \
                  --exclude=__pycache__ \
                  . || true

      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.json
          category: semgrep

      - name: Upload Semgrep results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  # Snyk Security Scanning
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Backend (Go) Snyk scan
      - name: Snyk Go scan
        uses: snyk/actions/golang@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/go.mod --sarif-file-output=snyk-go.sarif

      # Frontend (Node.js) Snyk scan
      - name: Snyk Node.js scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=frontend/package.json --sarif-file-output=snyk-node.sarif

      # Python (ML Service) Snyk scan
      - name: Snyk Python scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=Ian_ML/requirements.txt --sarif-file-output=snyk-python.sarif

      - name: Upload Snyk Go results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-go.sarif
          category: snyk-go

      - name: Upload Snyk Node results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-node.sarif
          category: snyk-node

      - name: Upload Snyk Python results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-python.sarif
          category: snyk-python

  # Secret Scanning (detect-secrets)
  detect-secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history for secret detection
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan \
            --exclude-files='.*\.lock$' \
            --exclude-files='.*\.sum$' \
            --exclude-files='.*_test\.go$' \
            --exclude-files='.*\.test\.jsx?$' \
            --exclude-files='.*\.spec\.js$' \
            --exclude-files='node_modules/.*' \
            --exclude-files='venv/.*' \
            --exclude-files='\.git/.*' \
            --baseline .secrets.baseline \
            --all-files \
            > detect-secrets-results.json 2>&1 || true

      - name: Check for new secrets
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets audit .secrets.baseline
          fi

      - name: Upload secret detection results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detect-secrets-results
          path: detect-secrets-results.json
          retention-days: 30

  # Dependency Vulnerability Scanning (OWASP Dependency Check)
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check (Frontend)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DianaV2-Frontend'
          path: 'frontend'
          format: 'ALL'
          args: >
            --enableExperimental
            --nodePackageSkipDevDependencies

      - name: Run OWASP Dependency Check (Backend)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DianaV2-Backend'
          path: 'backend'
          format: 'ALL'
          args: >
            --enableExperimental
            --go

      - name: Upload dependency check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-reports
          path: reports/
          retention-days: 30

  # Container Security Scanning with Trivy
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning
        run: |
          docker build -f build/Dockerfile -t diana-backend:scan .

      - name: Build ML image for scanning
        run: |
          docker build -f Ian_ML/Dockerfile -t diana-ml:scan .

      - name: Build frontend image for scanning
        run: |
          docker build -f frontend/Dockerfile -t diana-frontend:scan ./frontend

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'diana-backend:scan'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: Run Trivy vulnerability scanner (ML)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'diana-ml:scan'
          format: 'sarif'
          output: 'trivy-ml-results.sarif'

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'diana-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

      - name: Upload Trivy results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: |
            trivy-backend-results.sarif
            trivy-ml-results.sarif
            trivy-frontend-results.sarif
          retention-days: 30
