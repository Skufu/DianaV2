name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$RELEASE_VERSION_INPUT"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$RELEASE_VERSION"

          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE=""
          else
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          # Features
          echo "### 🚀 Features" >> CHANGELOG.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*feat(\(.+\))?:" >> CHANGELOG.md || echo "- No new features" >> CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*feat(\(.+\))?:" | head -20 >> CHANGELOG.md || echo "- No new features" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

          # Bug Fixes
          echo "### 🐛 Bug Fixes" >> CHANGELOG.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*fix(\(.+\))?:" >> CHANGELOG.md || echo "- No bug fixes" >> CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*fix(\(.+\))?:" | head -20 >> CHANGELOG.md || echo "- No bug fixes" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

          # Documentation
          echo "### 📚 Documentation" >> CHANGELOG.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*docs(\(.+\))?:" >> CHANGELOG.md || echo "- No documentation changes" >> CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*docs(\(.+\))?:" | head -10 >> CHANGELOG.md || echo "- No documentation changes" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

          # Performance
          echo "### ⚡ Performance" >> CHANGELOG.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*perf(\(.+\))?:" >> CHANGELOG.md || echo "- No performance improvements" >> CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*perf(\(.+\))?:" | head -10 >> CHANGELOG.md || echo "- No performance improvements" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

          # Refactoring
          echo "### 🔧 Refactoring" >> CHANGELOG.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*refactor(\(.+\))?:" >> CHANGELOG.md || echo "- No refactoring changes" >> CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges | grep -E "^.*refactor(\(.+\))?:" | head -10 >> CHANGELOG.md || echo "- No refactoring changes" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

          # Other changes
          echo "### 📝 Other Changes" >> CHANGELOG.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -vE "^(feat|fix|docs|perf|refactor)(\(.+\))?:" >> CHANGELOG.md || echo "- No other changes" >> CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges | grep -vE "^(feat|fix|docs|perf|refactor)(\(.+\))?:" | head -10 >> CHANGELOG.md || echo "- No other changes" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

          # Contributors
          echo "## 👥 Contributors" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"%an" --no-merges | sort | uniq | awk '{print "- " $0}' >> CHANGELOG.md
          else
            git log --pretty=format:"%an" --no-merges | sort | uniq | head -10 | awk '{print "- " $0}' >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

          # Full changelog link
          echo "**Full Changelog**: https://github.com/$RELEASE_REPOSITORY/compare/${PREVIOUS_TAG}...${VERSION}" >> CHANGELOG.md

          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}

  update-changelog-file:
    runs-on: ubuntu-latest
    needs: generate-release-notes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CHANGELOG.md file
        env:
          RELEASE_VERSION: ${{ needs.generate-release-notes.outputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          DATE=$(date +%Y-%m-%d)

          # Create new changelog entry
          {
            echo "# Changelog"
            echo ""
            echo "All notable changes to this project will be documented in this file."
            echo ""
            echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),"
            echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."
            echo ""
            echo "## [Unreleased]"
            echo ""
            echo "## [$VERSION] - $DATE"
            echo ""
          } > CHANGELOG.new.md

          # Get commits for this version
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
          else
            COMMIT_RANGE=""
          fi

          # Add features
          echo "### Added" >> CHANGELOG.new.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"- %s" --no-merges | grep -E "^.*feat(\(.+\))?:" | sed 's/feat(\([^)]*\))?:/- /' >> CHANGELOG.new.md || echo "- No new features" >> CHANGELOG.new.md
          else
            git log --pretty=format:"- %s" --no-merges | grep -E "^.*feat(\(.+\))?:" | sed 's/feat(\([^)]*\))?:/- /' | head -20 >> CHANGELOG.new.md || echo "- No new features" >> CHANGELOG.new.md
          fi
          echo "" >> CHANGELOG.new.md

          # Add fixes
          echo "### Fixed" >> CHANGELOG.new.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"- %s" --no-merges | grep -E "^.*fix(\(.+\))?:" | sed 's/fix(\([^)]*\))?:/- /' >> CHANGELOG.new.md || echo "- No bug fixes" >> CHANGELOG.new.md
          else
            git log --pretty=format:"- %s" --no-merges | grep -E "^.*fix(\(.+\))?:" | sed 's/fix(\([^)]*\))?:/- /' | head -20 >> CHANGELOG.new.md || echo "- No bug fixes" >> CHANGELOG.new.md
          fi
          echo "" >> CHANGELOG.new.md

          # Add changed
          echo "### Changed" >> CHANGELOG.new.md
          if [ -n "$COMMIT_RANGE" ]; then
            git log $COMMIT_RANGE --pretty=format:"- %s" --no-merges | grep -E "^.*(refactor|perf)(\(.+\))?:" | sed 's/\(refactor\|perf\)(\([^)]*\))?:/- /' >> CHANGELOG.new.md || echo "- No changes" >> CHANGELOG.new.md
          else
            git log --pretty=format:"- %s" --no-merges | grep -E "^.*(refactor|perf)(\(.+\))?:" | sed 's/\(refactor\|perf\)(\([^)]*\))?:/- /' | head -20 >> CHANGELOG.new.md || echo "- No changes" >> CHANGELOG.new.md
          fi
          echo "" >> CHANGELOG.new.md

          # Preserve old changelog content if exists
          if [ -f CHANGELOG.md ] && ! head -1 CHANGELOG.md | grep -q "# Changelog"; then
            tail -n +2 CHANGELOG.md >> CHANGELOG.new.md
          fi

          mv CHANGELOG.new.md CHANGELOG.md

          cat CHANGELOG.md

      - name: Commit updated CHANGELOG
        env:
          RELEASE_VERSION: ${{ needs.generate-release-notes.outputs.version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG for $RELEASE_VERSION"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
