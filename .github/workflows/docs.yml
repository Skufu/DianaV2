name: Documentation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**/*.go'
      - 'backend/docs/**'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**/*.go'
      - 'backend/docs/**'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - '.github/workflows/docs.yml'

jobs:
  # Generate and validate Swagger/OpenAPI documentation
  swagger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger documentation
        run: |
          # Temporarily move files that may have syntax errors
          if [ -f "internal/http/handlers/privacy.go" ]; then
            mv internal/http/handlers/privacy.go /tmp/privacy.go.bak
          fi
          # Temporarily move metrics if it has issues
          if [ -d "internal/metrics" ]; then
            mv internal/metrics /tmp/metrics.bak
          fi

          swag init -g cmd/server/main.go -d . --parseDependency --parseInternal -o ./docs

          # Restore files
          if [ -f "/tmp/privacy.go.bak" ]; then
            mv /tmp/privacy.go.bak internal/http/handlers/privacy.go
          fi
          if [ -d "/tmp/metrics.bak" ]; then
            mv /tmp/metrics.bak internal/metrics
          fi

      - name: Validate Swagger JSON
        run: |
          if [ ! -f "docs/swagger.json" ]; then
            echo "❌ swagger.json not found"
            exit 1
          fi

          # Check if swagger.json is valid JSON
          if ! jq empty docs/swagger.json; then
            echo "❌ swagger.json is not valid JSON"
            exit 1
          fi

          # Count documented paths
          PATH_COUNT=$(jq '.paths | length' docs/swagger.json)
          echo "✓ swagger.json has $PATH_COUNT documented paths"

          if [ "$PATH_COUNT" -lt 5 ]; then
            echo "❌ Too few documented paths (expected at least 5)"
            exit 1
          fi

          echo "✅ Swagger documentation is valid"

      - name: Check for uncommitted swagger changes
        run: |
          cd ..
          if ! git diff --quiet -- backend/docs/ 2>/dev/null; then
            echo "⚠️  WARNING: Swagger documentation is out of sync"
            echo "Run 'make swagger' locally to regenerate"
            git diff --stat -- backend/docs/
            # Don't fail the build, just warn
            exit 0
          fi
          echo "✅ Swagger documentation is up to date"

      - name: Upload Swagger artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swagger-docs
          path: |
            backend/docs/swagger.json
            backend/docs/swagger.yaml
          retention-days: 30

  # Validate AGENTS.md documentation
  agents-md:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run AGENTS.md validation
        run: bash scripts/ci/validate-agents-md.sh

  # Generate and deploy documentation (only on main branch)
  deploy-docs:
    runs-on: ubuntu-latest
    needs: [swagger, agents-md]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Download Swagger artifacts
        uses: actions/download-artifact@v4
        with:
          name: swagger-docs
          path: backend/docs/

      - name: Generate API documentation summary
        run: |
          echo "# DIANA API Documentation" > API.md
          echo "" >> API.md
          echo "## Swagger/OpenAPI Specification" >> API.md
          echo "" >> API.md
          echo "The API documentation is available in the following formats:" >> API.md
          echo "" >> API.md
          echo "- [swagger.json](backend/docs/swagger.json) - OpenAPI 2.0 JSON format" >> API.md
          echo "- [swagger.yaml](backend/docs/swagger.yaml) - OpenAPI 2.0 YAML format" >> API.md
          echo "" >> API.md
          echo "## Interactive Documentation" >> API.md
          echo "" >> API.md
          echo "When the server is running, interactive Swagger UI is available at:" >> API.md
          echo "\`\`\`" >> API.md
          echo "http://localhost:8080/swagger/index.html" >> API.md
          echo "\`\`\`" >> API.md
          echo "" >> API.md
          echo "## Endpoints Overview" >> API.md
          echo "" >> API.md

          # Extract endpoint info from swagger.json
          jq -r '.paths | to_entries[] | "### " + .key + "\n" + (.value | to_entries[] | "- **" + .key + "**: " + (.value.summary // "No summary"))' backend/docs/swagger.json >> API.md

          cat API.md

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: API.md
          retention-days: 30
