name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/cd.yml'
      - 'backend/**'
      - 'build/Dockerfile'
      - 'Ian_ML/**'
      - 'models/**'
      - 'deployment/Caddyfile'
      - 'deployment/vps/**'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Build images only, or also deploy them to production'
        required: true
        default: production
        type: choice
        options:
          - production
          - build-only

concurrency:
  group: diana-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/skufu/diana-backend
  ML_IMAGE: ghcr.io/skufu/diana-ml
  DEPLOY_DIR: /opt/dianav2
  PUBLIC_HEALTH_URL: https://diana-v2.duckdns.org/api/v1/healthz

jobs:
  build-and-push:
    name: Build backend and ML images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_target: ${{ steps.mode.outputs.deploy_target }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      release_label: ${{ steps.version.outputs.release_label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deployment mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_TARGET="${{ inputs.deploy_target }}"
          else
            DEPLOY_TARGET="production"
          fi
          echo "deploy_target=${DEPLOY_TARGET}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IMAGE_TAG="sha-${SHORT_SHA}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_LABEL="${GITHUB_REF_NAME}"
            MOVING_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_LABEL="main-${SHORT_SHA}"
            MOVING_TAG="main"
          fi

          {
            echo "short_sha=${SHORT_SHA}"
            echo "image_tag=${IMAGE_TAG}"
            echo "release_label=${RELEASE_LABEL}"
            echo "moving_tag=${MOVING_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image tag lists
        id: tags
        run: |
          {
            echo 'backend_tags<<EOF'
            echo "${BACKEND_IMAGE}:${{ steps.version.outputs.image_tag }}"
            echo "${BACKEND_IMAGE}:${{ steps.version.outputs.moving_tag }}"
            echo 'EOF'
            echo 'ml_tags<<EOF'
            echo "${ML_IMAGE}:${{ steps.version.outputs.image_tag }}"
            echo "${ML_IMAGE}:${{ steps.version.outputs.moving_tag }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.backend_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=DianaV2 Backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push ML service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Ian_ML/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.ml_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=DianaV2 ML Service
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml

  deploy-production:
    name: Deploy backend and ML to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.deploy_target == 'production'
    environment:
      name: Production
      url: ${{ env.PUBLIC_HEALTH_URL }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY REGISTRY_USERNAME REGISTRY_PASSWORD TAILSCALE_AUTHKEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent-action@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Install production deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # shellcheck disable=SC2029
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_DIR}' '${DEPLOY_DIR}/logs'"
          scp deployment/vps/docker-compose.yml "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/diana-docker-compose.yml"
          scp deployment/Caddyfile "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/diana-Caddyfile"
          scp deployment/vps/deploy-images.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/diana-deploy-images.sh"
          scp deployment/vps/rollback-images.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/diana-rollback-images.sh"
          # shellcheck disable=SC2029
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "\
            cp /tmp/diana-docker-compose.yml '${DEPLOY_DIR}/docker-compose.yml' && \
            cp /tmp/diana-Caddyfile '${DEPLOY_DIR}/Caddyfile' && \
            cp /tmp/diana-deploy-images.sh '${DEPLOY_DIR}/deploy-images.sh' && \
            cp /tmp/diana-rollback-images.sh '${DEPLOY_DIR}/rollback-images.sh' && \
            chmod 700 '${DEPLOY_DIR}/deploy-images.sh' '${DEPLOY_DIR}/rollback-images.sh'"

      - name: Deploy immutable image tag
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          REGISTRY_PASSWORD_B64="$(printf '%s' "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
          # shellcheck disable=SC2029
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "\
            cd '${DEPLOY_DIR}' && \
            REGISTRY='${REGISTRY}' \
            REGISTRY_USERNAME='${REGISTRY_USERNAME}' \
            REGISTRY_PASSWORD=\"\$(printf '%s' '${REGISTRY_PASSWORD_B64}' | base64 -d)\" \
            BACKEND_IMAGE='${BACKEND_IMAGE}' \
            ML_IMAGE='${ML_IMAGE}' \
            IMAGE_TAG='${IMAGE_TAG}' \
            PUBLIC_HEALTH_URL='${PUBLIC_HEALTH_URL}' \
            ./deploy-images.sh"

      - name: Roll back on failed deploy
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          REGISTRY_PASSWORD_B64="$(printf '%s' "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
          # shellcheck disable=SC2029
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "\
            cd '${DEPLOY_DIR}' && \
            REGISTRY='${REGISTRY}' \
            REGISTRY_USERNAME='${REGISTRY_USERNAME}' \
            REGISTRY_PASSWORD=\"\$(printf '%s' '${REGISTRY_PASSWORD_B64}' | base64 -d)\" \
            PUBLIC_HEALTH_URL='${PUBLIC_HEALTH_URL}' \
            ./rollback-images.sh"

      - name: Verify public backend health
        run: |
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail --show-error --silent "${PUBLIC_HEALTH_URL}"
          echo
          echo "Deployed ${{ needs.build-and-push.outputs.release_label }} (${{ needs.build-and-push.outputs.image_tag }}) to ${PUBLIC_HEALTH_URL}"
