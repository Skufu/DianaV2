# Production Nginx Configuration with TLS/SSL
# This configuration provides:
# - HTTPS on port 443
# - HTTP to HTTPS redirect on port 80
# - TLS 1.2+ only (TLS 1.0 and 1.1 disabled)
# - Strong cipher suites
# - HSTS header
# - Security headers
#
# Prerequisites:
# - SSL certificates obtained via Let's Encrypt (see scripts/setup-ssl.sh)
# - Certificates placed in /etc/nginx/ssl/ or mapped via Docker volume

# HTTP server - redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSL Certificate Configuration
    # For Let's Encrypt certificates:
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # TLS Protocol Configuration - TLS 1.2+ only
    # TLS 1.0 and 1.1 are deprecated and insecure
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong Cipher Suites
    # Prefers ECDHE for forward secrecy, AESGCM for authenticated encryption
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Server prefers its cipher order (prevents client from forcing weak ciphers)
    ssl_prefer_server_ciphers off;

    # SSL Session Configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security)
    # Tells browsers to only use HTTPS for 1 year
    # includeSubDomains applies to all subdomains
    # preload allows submission to browser preload list
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # OCSP Stapling (for Let's Encrypt certificates)
    # Improves SSL handshake performance by stapling OCSP response
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint (no redirect, no auth required)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy to backend (if frontend serves as reverse proxy)
    # Uncomment if using nginx as reverse proxy for backend
    # location /api/ {
    #     proxy_pass http://backend:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Request-ID $request_id;
    #     proxy_connect_timeout 30s;
    #     proxy_read_timeout 60s;
    # }

    # ML service proxy (if frontend serves as reverse proxy)
    # Uncomment if using nginx as reverse proxy for ML
    # location /ml/ {
    #     proxy_pass http://ml:5000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_connect_timeout 30s;
    #     proxy_read_timeout 60s;
    # }
}
