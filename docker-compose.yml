# DIANA V2 Multi-Service Docker Compose
# Usage: docker-compose up --build
#
# Required environment variables (set in .env file or export):
#   POSTGRES_PASSWORD - Database password
#   JWT_SECRET - JWT signing secret (min 32 chars)
#   ML_API_KEY - API key for ML server authentication
#
# Optional:
#   VITE_API_BASE - Backend API URL (default: http://localhost:8080)
#
# Deployment:
#   DIANA_BACKEND_IMAGE - Override backend image (default: build from source)
#   DIANA_ML_IMAGE - Override ML image (default: build from source)
#   DIANA_FRONTEND_IMAGE - Override frontend image (default: build from source)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: diana-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-diana}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diana}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go Backend API
  backend:
    image: ${DIANA_BACKEND_IMAGE:-}
    build:
      context: .
      dockerfile: build/Dockerfile
    container_name: diana-backend
    environment:
      PORT: 8080
      ENV: production
      DB_DSN: postgres://${POSTGRES_USER:-diana}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-diana}?sslmode=${POSTGRES_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required (min 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:4000}
      MODEL_URL: http://ml:5000
      ML_API_KEY: ${ML_API_KEY:?ML API key required when ENV=production}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DIANA_LOG_DIR: /var/log/diana
      DIANA_LOG_MAX_BYTES: ${DIANA_LOG_MAX_BYTES:-5242880}
      DIANA_LOG_MAX_BACKUPS: ${DIANA_LOG_MAX_BACKUPS:-3}
    ports:
      - "8080:8080"
    volumes:
      - diana_logs:/var/log/diana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Python ML Server
  ml:
    image: ${DIANA_ML_IMAGE:-}
    build:
      context: .
      dockerfile: Ian_ML/Dockerfile
    container_name: diana-ml
    environment:
      ML_PORT: 5000
      PYTHONUNBUFFERED: 1
      ML_API_KEY: ${ML_API_KEY:?ML API key required when ENV=production}
      ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DIANA_LOG_DIR: /var/log/diana
      DIANA_LOG_MAX_BYTES: ${DIANA_LOG_MAX_BYTES:-5242880}
      DIANA_LOG_MAX_BACKUPS: ${DIANA_LOG_MAX_BACKUPS:-3}
    ports:
      - "5001:5000"
    volumes:
      - ./models:/app/models:ro
      - diana_logs:/var/log/diana
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # React Frontend (Nginx)
  frontend:
    image: ${DIANA_FRONTEND_IMAGE:-}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    container_name: diana-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - ml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  diana_logs:
