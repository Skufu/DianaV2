# Air configuration for Go hot-reload in Docker development
# Documentation: https://github.com/cosmtrek/air

root = "."
tmp_dir = "tmp"

[build]
# Command to build the Go application
cmd = "go build -o ./tmp/server ./backend/cmd/server"
# Binary file to run
bin = "./tmp/server"
# Directories to watch for changes
include_dir = ["backend"]
# File extensions to watch
include_ext = ["go", "tpl", "tmpl", "html"]
# Directories to exclude from watching
exclude_dir = ["tmp", "vendor", "node_modules", "frontend", "Ian_ML", "Neoron_ML", "models", "data", "docs", ".git"]
# Files to exclude
exclude_file = []
# Regex for excluded files
exclude_regex = ["_test\\.go$"]
# Delay before rebuilding (milliseconds)
delay = 1000
# Stop running old binary before building new one
stop_on_error = true
# Send interrupt signal before killing process
send_interrupt = true
# Delay after sending interrupt signal (milliseconds)
kill_delay = 500
# Log build output
log = "air.log"
# Show full build command
full_bin = ""
# Build arguments
args_bin = []

[log]
# Show log time
time = true
# Only show main log (errors and warnings)
main_only = false

[color]
# Colors for different log types
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true
