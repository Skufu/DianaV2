# DianaV2 Production Docker Compose with TLS/SSL
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overlays production-specific configuration including:
# - TLS/SSL termination via Nginx reverse proxy
# - HTTP to HTTPS redirect
# - Let's Encrypt certificate integration
# - Secure defaults for production deployment
#
# Prerequisites:
#   1. Run scripts/setup-ssl.sh to obtain Let's Encrypt certificates
#   2. Ensure certificates are in /etc/nginx/ssl/ on host
#   3. Domain configured and pointing to server IP
#
# Validation: VAL-DP-003 - TLS/SSL Enabled

services:
  # Nginx Reverse Proxy with TLS Termination
  # Handles HTTPS on port 443 and redirects HTTP to HTTPS
  nginx-proxy:
    image: nginx:alpine
    container_name: diana-nginx-proxy
    ports:
      # HTTPS port (primary)
      - "443:443"
      # HTTP port (redirects to HTTPS)
      - "80:80"
    volumes:
      # SSL certificates from Let's Encrypt
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
      # Production nginx configuration with TLS
      - ./frontend/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ml
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - diana-production

  # Go Backend API - Production Settings
  backend:
    image: ${DIANA_BACKEND_IMAGE:-}
    build:
      context: .
      dockerfile: build/Dockerfile
    container_name: diana-backend
    environment:
      PORT: 8080
      ENV: production
      # PostgreSQL with SSL required (sslmode=require for production)
      DB_DSN: postgres://${POSTGRES_USER:-diana}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-diana}?sslmode=require
      JWT_SECRET: ${JWT_SECRET:?JWT secret required (min 32 chars)}
      # CORS origins should include HTTPS domain
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,https://${DOMAIN:-localhost}}
      MODEL_URL: http://ml:5000
      ML_API_KEY: ${ML_API_KEY:-}
      # Production-specific settings
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      DIANA_LOG_DIR: /var/log/diana
      DIANA_LOG_MAX_BYTES: ${DIANA_LOG_MAX_BYTES:-5242880}
      DIANA_LOG_MAX_BACKUPS: ${DIANA_LOG_MAX_BACKUPS:-3}
    # No external port exposure - only accessible via nginx proxy
    ports: !reset []
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - diana_logs:/var/log/diana
    networks:
      - diana-production

  # Python ML Server - Production Settings
  ml:
    image: ${DIANA_ML_IMAGE:-}
    build:
      context: .
      dockerfile: Ian_ML/Dockerfile
    container_name: diana-ml
    environment:
      ML_PORT: 5000
      PYTHONUNBUFFERED: 1
      ML_API_KEY: ${ML_API_KEY:-}
      ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,https://${DOMAIN:-localhost}}
      DIANA_LOG_DIR: /var/log/diana
      DIANA_LOG_MAX_BYTES: ${DIANA_LOG_MAX_BYTES:-5242880}
      DIANA_LOG_MAX_BACKUPS: ${DIANA_LOG_MAX_BACKUPS:-3}
    # No external port exposure - only accessible via nginx proxy
    ports: !reset []
    expose:
      - "5000"
    # Use model artifacts baked into the ML image during CD. Mounting the host
    # models directory in production can accidentally shadow the promoted image.
    volumes: !override
      - diana_logs:/var/log/diana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - diana-production

  # React Frontend - Production Build
  frontend:
    image: ${DIANA_FRONTEND_IMAGE:-}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://${DOMAIN:-localhost}/api/v1}
        VITE_ML_BASE: ${VITE_ML_BASE:-https://${DOMAIN:-localhost}/ml}
    container_name: diana-frontend
    # No external port exposure - nginx proxy serves static files
    ports: !reset []
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - diana-production

  # PostgreSQL Database - Production Settings
  postgres:
    image: postgres:16-alpine
    container_name: diana-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-diana}
    # No external port exposure - only accessible internally
    ports: !reset []
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diana}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - diana-production

  # Certbot for Certificate Renewal (optional)
  # Runs periodic certificate renewal checks
  certbot:
    image: certbot/certbot:latest
    container_name: diana-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - /var/log/letsencrypt:/var/log/letsencrypt
    # Run renewal check every 12 hours
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'
    restart: unless-stopped
    networks:
      - diana-production

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  diana_logs:
    driver: local

# Production network (isolated from development)
networks:
  diana-production:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
