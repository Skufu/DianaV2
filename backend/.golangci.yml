version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
  exclusions:
    rules:
      # Exclude some linters from running on tests
      - path: _test\.go
        linters:
          - errcheck
      # Ignore generated files
      - path: sqlc/
        linters:
          - errcheck
