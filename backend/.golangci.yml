version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

issues:
  exclude:
    # Exclude some linters from running on tests
    - path: _test\.go
      linters:
        - errcheck
    # Ignore generated files
    - path: sqlc/
      linters:
        - errcheck
