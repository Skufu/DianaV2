root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/main.exe"
  full_bin = "./tmp/main.exe"
  cmd = "go build -o tmp/main.exe ./cmd/server"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "migrations", "venv", "node_modules", ".git", "logs", "frontend", "Ian_ML", "Neoron_ML", "models"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = false
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "500ms"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = false

[log]
  time = true
  color = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
